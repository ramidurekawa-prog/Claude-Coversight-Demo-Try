# Netlify deployment for the Streamline demo.
#
# One site hosts everything: the Next.js UI and the API, which runs inside a
# catch-all route handler, because a serverless
# platform has no second process to proxy to.
#
# Set these in Site configuration → Environment variables:
#   DATABASE_URL           Postgres connection string (use the POOLED one).
#                          Netlify's own database extension sets
#                          NETLIFY_DATABASE_URL instead, which is read too, so
#                          adding a database with one click needs nothing here.
#   BETTER_AUTH_SECRET     any long random string
#   STREAMLINE_SKIP_MIGRATIONS 1   (the build migrates; cold starts should not)
#   STREAMLINE_PG_POOL_MAX     1   (every warm instance keeps its own pool)
#
# Embedding is detected from NETLIFY itself, so STREAMLINE_EMBEDDED_API is only
# needed to override it (1 = embed, 0 = proxy to API_URL).
#
# If the build UI asks: Base directory = repository root, Package directory =
# apps/web.

# The build migrates and seeds the database before building the site: a
# function has ten seconds, a build has fifteen minutes and the same
# environment, so this is the only place the fixture fits. It is idempotent —
# already-seeded databases are a no-op — and it skips with a warning rather
# than failing when no connection string is set, because the site it produces
# explains that itself.
[build]
  command = "pnpm db:seed:deploy && pnpm --filter @streamline/web build"
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION = "22"
  PNPM_FLAGS = "--frozen-lockfile=false"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# The demo clock rebuilds a slice of the register and re-runs the engine, which
# is the one request that can outlast a default 10s function. Netlify's Pro plan
# raises the ceiling to 26s; on the free plan, advance in smaller steps.
[functions]
  node_bundler = "esbuild"
  external_node_modules = ["fastify", "better-auth", "@better-auth/drizzle-adapter", "pg", "@electric-sql/pglite"]
